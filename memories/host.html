<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Solenizanta - Memories18</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
           <link rel="icon" type="image/x-icon" href="https://memories18.pages.dev/files-content/favicon-18-logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                        handwriting: ['Caveat', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        .polaroid-shadow {
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.08), 0 3px 5px -2px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-[#f6f5f2] text-stone-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-amber-200">

    <!-- Elegancki nagłówek z powiększonym i wyśrodkowanym logo -->
    <header class="py-6 px-6 max-w-7xl mx-auto w-full flex items-center justify-between relative">
        <div class="w-24"></div> <!-- Pusty element dla zachowania idealnego wyśrodkowania logo -->
        <div class="absolute left-1/2 -translate-x-1/2">
            <img src="https://memories18.pages.dev/files-content/memories18_logo.svg" alt="Memories18" class="h-14 w-auto object-contain">
        </div>
        <div id="host-header-info" class="hidden items-center gap-3 z-10">
            <span id="nav-event-title" class="font-heading font-semibold text-sm text-stone-700 hidden sm:inline">Impreza</span>
            <button onclick="logoutHost()" class="text-xs bg-stone-200/70 hover:bg-stone-300/70 text-stone-700 font-medium px-3.5 py-2 rounded-xl transition-colors">Wyloguj</button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-5 py-8 w-full flex flex-col justify-center">
        
        <!-- Ekran logowania -->
        <div id="login-view" class="max-w-md mx-auto bg-white border border-stone-200/80 rounded-2xl p-8 shadow-sm text-center w-full">
            <div class="w-12 h-12 bg-stone-100 text-stone-700 rounded-full flex items-center justify-center text-lg mx-auto mb-4">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="font-heading font-bold text-xl text-stone-900 mb-2">Panel Solenizanta</h1>
            <p class="text-stone-500 text-sm mb-6 leading-relaxed">Wpisz hasło otrzymane od organizatora, aby wyświetlić galerię wspomnień.</p>
            
            <form onsubmit="handleHostLogin(event)" class="space-y-3">
                <input type="password" id="host-password-input" required placeholder="Wpisz hasło..." class="w-full bg-stone-50/50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-center text-stone-800 placeholder-stone-400 focus:outline-none focus:border-stone-900 transition-colors font-mono">
                <button type="submit" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-heading font-semibold py-3 px-6 rounded-xl shadow-sm transition-all text-sm">
                    Zaloguj się
                </button>
            </form>
            <p id="login-error" class="text-rose-600 text-xs mt-3 hidden font-medium">Nieprawidłowe hasło!</p>
        </div>

        <!-- Galeria zdjęć -->
        <div id="gallery-view" class="hidden space-y-8">
            <div class="bg-white border border-stone-200/80 rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
                <div>
                    <span class="text-xs tracking-widest uppercase font-heading font-semibold text-stone-400 block mb-1">Galeria</span>
                    <h1 id="gallery-title" class="font-heading font-bold text-2xl sm:text-3xl text-stone-900">Wspomnienia z imprezy</h1>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                    <div class="bg-stone-50 border border-stone-200/80 rounded-xl px-4 py-2.5 text-center">
                        <span id="photo-count" class="font-heading font-bold text-xl text-stone-900 block leading-tight">0</span>
                        <span class="text-[10px] text-stone-400 uppercase tracking-wider font-semibold">Zdjęć</span>
                    </div>
                    <button onclick="loadPhotos()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 p-3 rounded-xl transition-all" title="Odśwież zdjęcia">
                        <i class="fa-solid fa-rotate text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Siatka zdjęć w stylu polaroidów -->
            <div id="photos-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Zdjęcia wstrzykiwane dynamicznie -->
            </div>
        </div>
    </main>

    <!-- Lightbox (Powiększenie zdjęcia) -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-stone-900/80 backdrop-blur-xs hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-3xl max-h-[90vh] w-full flex flex-col items-center bg-white p-4 sm:p-6 rounded-2xl shadow-2xl" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-900 text-xl transition-colors w-8 h-8 flex items-center justify-center bg-stone-100 rounded-full">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="w-full max-h-[65vh] bg-stone-100 rounded-xl overflow-hidden flex items-center justify-center mb-4">
                <img id="lightbox-img" src="" alt="Powiększenie" class="max-h-[65vh] max-w-full object-contain">
            </div>
            <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-stone-100 pt-4">
                <div>
                    <p id="lightbox-author" class="font-handwriting text-3xl text-stone-800 text-center sm:text-left"></p>
                    <p id="lightbox-date" class="text-xs text-stone-400 font-mono text-center sm:text-left mt-0.5"></p>
                </div>
                <a id="lightbox-download" href="" target="_blank" download class="w-full sm:w-auto bg-stone-900 hover:bg-stone-800 text-white px-4 py-2.5 rounded-xl text-xs font-heading font-semibold transition-all text-center">
                    <i class="fa-solid fa-download mr-1.5"></i> Pobierz oryginał
                </a>
            </div>
        </div>
    </div>

    <!-- Stopka -->
    <footer class="py-6 text-stone-400 text-xs text-center mt-12">
        <p>Memories18 &copy; 2026 RAKSO Web Development</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');
        let currentEventData = null;
        let supabaseClient = null;

        const DEFAULT_SUPABASE_URL = 'https://exislasbcahoacmqhpaf.supabase.co';
        const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4aXNsYXNiY2Fob2FjbXFocGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTMzNDksImV4cCI6MjEwNjA2OTM0OX0.71P6ArRLyDg3AJdCCKXIgaUBI2wawBTRYYxh36Iq5yY';

        window.addEventListener('DOMContentLoaded', async () => {
            const savedUrl = localStorage.getItem('mem_supa_url') || DEFAULT_SUPABASE_URL;
            const savedKey = localStorage.getItem('mem_supa_key') || DEFAULT_SUPABASE_KEY;
            
            try {
                supabaseClient = window.supabase.createClient(savedUrl, savedKey);
            } catch (e) {
                console.error(e);
            }

            if (!eventId) {
                document.getElementById('login-view').innerHTML = `<p class="text-stone-800 font-medium text-sm">Brak ID imprezy w adresie URL.</p>`;
                return;
            }

            const { data, error } = await supabaseClient.from('memories_events').select('*').eq('id', eventId).single();
            if (error || !data) {
                document.getElementById('login-view').innerHTML = `<p class="text-stone-800 font-medium text-sm">Nie znaleziono wydarzenia w bazie.</p>`;
                return;
            }
            currentEventData = data;

            const sessionKey = `host_auth_${eventId}`;
            if (sessionStorage.getItem(sessionKey) === 'true') {
                showGallery();
            }
        });

        async function handleHostLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('host-password-input').value.trim();
            if (pass === currentEventData.password) {
                sessionStorage.setItem(`host_auth_${eventId}`, 'true');
                showGallery();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logoutHost() {
            sessionStorage.removeItem(`host_auth_${eventId}`);
            location.reload();
        }

        async function showGallery() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('gallery-view').classList.remove('hidden');
            document.getElementById('host-header-info').classList.remove('hidden');
            document.getElementById('host-header-info').classList.add('flex');
            document.getElementById('nav-event-title').textContent = currentEventData.title;
            document.getElementById('gallery-title').textContent = currentEventData.title;

            await loadPhotos();
        }

        async function loadPhotos() {
            const { data, error } = await supabaseClient
                .from('memories_photos')
                .select('*')
                .eq('event_id', eventId)
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            document.getElementById('photo-count').textContent = data.length;
            const gridEl = document.getElementById('photos-grid');

            if (data.length === 0) {
                gridEl.innerHTML = `
                    <div class="col-span-full text-center py-16 text-stone-400 bg-white rounded-2xl border border-stone-200/80">
                        <i class="fa-regular fa-images text-3xl mb-2 block text-stone-300"></i>
                        <p class="text-sm font-medium text-stone-600">Brak zdjęć w tej chwili.</p>
                        <p class="text-xs text-stone-400 mt-1">Goście wkrótce dodadzą pierwsze wspomnienia!</p>
                    </div>`;
                return;
            }

            let html = '';
            data.forEach((photo, index) => {
                const dateStr = new Date(photo.created_at).toLocaleString('pl-PL');
                const rotations = ['rotate-1', '-rotate-1', 'rotate-2', '-rotate-2', 'rotate-0'];
                const randomRot = rotations[index % rotations.length];

                html += `
                    <div class="bg-white p-3.5 pb-5 rounded-sm polaroid-shadow border border-stone-200/60 flex flex-col justify-between transition-transform hover:scale-[1.02] cursor-pointer ${randomRot}" onclick="openLightbox('${photo.image_url}', '${escapeHtml(photo.author)}', '${dateStr}')">
                        <div class="w-full aspect-square bg-stone-100 overflow-hidden mb-3">
                            <img src="${photo.image_url}" alt="Wspomnienie" class="w-full h-full object-cover">
                        </div>
                        <div class="px-1">
                            <p class="font-handwriting text-2xl text-stone-800 tracking-wide truncate mb-1">${escapeHtml(photo.author)}</p>
                            <p class="text-[10px] text-stone-400 font-mono">${dateStr}</p>
                        </div>
                    </div>
                `;
            });
            gridEl.innerHTML = html;
        }

        function openLightbox(url, author, date) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-author').textContent = author;
            document.getElementById('lightbox-date').textContent = date;
            document.getElementById('lightbox-download').href = url;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
