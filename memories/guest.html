<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj zdjęcie - Memories18</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                        handwriting: ['Caveat', 'cursive'],
                    },
                    colors: {
                        stone: {
                            850: '#1f1d1b',
                            900: '#171615',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .polaroid-shadow {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        .animate-polaroid {
            animation: floatSlow 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#f6f5f2] text-stone-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-amber-200">

    <!-- Minimalistyczny, elegancki nagłówek z wyśrodkowanym i powiększonym logo -->
    <header class="py-6 px-6 max-w-2xl mx-auto w-full flex items-center justify-center">
        <img src="https://memories18.pages.dev/files-content/memories18_logo.svg" alt="Memories18" class="h-14 w-auto object-contain">
    </header>

    <main class="flex-grow max-w-md mx-auto px-5 py-4 w-full flex flex-col justify-center">
        
        <!-- Stan: Ładowanie -->
        <div id="loading-view" class="text-center py-16 bg-white rounded-2xl shadow-sm border border-stone-200/60 p-8">
            <div class="inline-block w-8 h-8 border-2 border-stone-800 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-stone-500 font-medium text-sm">Ładowanie...</p>
        </div>

        <!-- Stan: Wygasłe wydarzenie -->
        <div id="expired-view" class="hidden bg-white border border-stone-200/80 rounded-2xl p-8 shadow-sm text-center">
            <div class="w-12 h-12 bg-stone-100 text-stone-700 rounded-full flex items-center justify-center text-lg mx-auto mb-4">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
            <h1 class="font-heading font-bold text-xl text-stone-900 mb-2">Wspomnienia zamknięte</h1>
            <p class="text-stone-500 text-sm leading-relaxed">Czas na dodawanie zdjęć do tej księgi dobiegł końca. Dziękujemy za wspólne chwile!</p>
        </div>

        <!-- Stan: Formularz wysyłania -->
        <div id="upload-view" class="hidden bg-white border border-stone-200/80 rounded-2xl p-6 sm:p-8 shadow-sm">
            <div class="mb-6">
                <h1 id="event-title-display" class="font-heading font-bold text-2xl text-stone-900 tracking-tight">Impreza</h1>
                <p class="text-stone-500 text-sm mt-1">Uwiecznij ten moment. Dodaj kadr z imprezy.</p>
            </div>

            <form id="photo-form" onsubmit="handleUploadPhoto(event)" class="space-y-4">
                <!-- Elegancki selektor zdjęcia -->
                <div class="relative border border-stone-200 rounded-xl p-4 text-center hover:border-stone-400 transition-all bg-stone-50/50 cursor-pointer group" onclick="document.getElementById('photo-input').click()">
                    <input type="file" id="photo-input" accept="image/*" required class="hidden" onchange="previewImage(event)">
                    
                    <div id="upload-placeholder" class="py-8">
                        <div class="w-12 h-12 bg-stone-200/70 group-hover:bg-stone-900 group-hover:text-white text-stone-700 rounded-full flex items-center justify-center text-base mx-auto mb-3 transition-colors">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                        <span class="font-heading font-semibold text-stone-800 block text-sm">Wybierz lub zrób zdjęcie</span>
                    </div>

                    <div id="upload-preview-container" class="hidden relative">
                        <img id="image-preview" src="" alt="Podgląd" class="max-h-56 mx-auto rounded-lg object-contain shadow-xs">
                        <span class="absolute bottom-2 right-2 bg-stone-900/80 backdrop-blur-xs text-white text-xs px-2.5 py-1 rounded-md font-medium">Zmień kadr</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1.5">Twój podpis / ksywka</label>
                    <input type="text" id="photo-author" maxlength="60" placeholder="np. Ola i Bartek" class="w-full bg-stone-50/50 border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:border-stone-900 transition-colors">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-heading font-semibold py-3.5 px-6 rounded-xl shadow-sm transition-all text-sm flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-arrow-up-from-bracket text-xs"></i> Dodaj do księgi
                </button>
            </form>
        </div>

        <!-- Stan: Sukces (Widok Polaroidu) -->
        <div id="success-view" class="hidden text-center py-2">
            <div class="mb-4">
                <span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full mb-3">
                    <i class="fa-solid fa-check mr-1"></i> Dodano pomyślnie
                </span>
                <h2 class="font-heading font-bold text-2xl text-stone-900">Twoje wspomnienie</h2>
            </div>

            <!-- Stylizowana ramka Polaroid -->
            <div class="bg-white p-4 pb-6 rounded-sm polaroid-shadow animate-polaroid max-w-[280px] mx-auto mb-6 transform -rotate-1 transition-transform hover:rotate-0">
                <div class="bg-stone-100 overflow-hidden aspect-square mb-4 flex items-center justify-center">
                    <img id="polaroid-img" src="" alt="Wspomnienie" class="w-full h-full object-cover">
                </div>
                <p id="polaroid-caption" class="font-handwriting text-2xl text-stone-700 tracking-wide truncate px-2">Podpis</p>
            </div>

            <button onclick="resetForm()" class="bg-white border border-stone-200 text-stone-700 font-heading font-semibold px-5 py-2.5 rounded-xl hover:bg-stone-50 transition-all text-xs shadow-xs">
                Wrzuć kolejne zdjęcie
            </button>
        </div>
    </main>

    <!-- Stopka -->
    <footer class="py-6 text-stone-400 text-xs text-center">
        <p>Memories18 &copy; 2026 RAKSO Web Development</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');
        let currentEventData = null;
        let supabaseClient = null;

        const DEFAULT_SUPABASE_URL = 'https://exislasbcahoacmqhpaf.supabase.co';
        const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4aXNsYXNiY2Fob2FjbXFocGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTMzNDksImV4cCI6MjEwNjA2OTM0OX0.71P6ArRLyDg3AJdCCKXIgaUBI2wawBTRYYxh36Iq5yY';

        window.addEventListener('DOMContentLoaded', async () => {
            const savedUrl = localStorage.getItem('mem_supa_url') || DEFAULT_SUPABASE_URL;
            const savedKey = localStorage.getItem('mem_supa_key') || DEFAULT_SUPABASE_KEY;
            
            try {
                supabaseClient = window.supabase.createClient(savedUrl, savedKey);
            } catch (e) {
                console.error(e);
            }

            if (!eventId) {
                document.getElementById('loading-view').innerHTML = `<p class="text-stone-800 font-medium text-sm">Brak ID imprezy w adresie URL.</p>`;
                return;
            }

            await checkEventAndLoad();
        });

        async function checkEventAndLoad() {
            const { data, error } = await supabaseClient.from('memories_events').select('*').eq('id', eventId).single();
            
            document.getElementById('loading-view').classList.add('hidden');

            if (error || !data) {
                document.getElementById('loading-view').classList.remove('hidden');
                document.getElementById('loading-view').innerHTML = `<p class="text-stone-800 font-medium text-sm">Nie znaleziono takiej imprezy w bazie.</p>`;
                return;
            }

            currentEventData = data;
            const deadline = new Date(data.deadline);
            const now = new Date();

            if (now > deadline) {
                document.getElementById('expired-view').classList.remove('hidden');
                return;
            }

            document.getElementById('event-title-display').textContent = data.title;
            document.getElementById('upload-view').classList.remove('hidden');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('upload-placeholder').classList.add('hidden');
                document.getElementById('upload-preview-container').classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }

        async function handleUploadPhoto(e) {
            e.preventDefault();
            const fileInput = document.getElementById('photo-input');
            const authorInput = document.getElementById('photo-author');
            const submitBtn = document.getElementById('submit-btn');

            if (!fileInput.files[0]) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Wysyłanie...`;

            const file = fileInput.files[0];
            const author = authorInput.value.trim() || 'Gość';
            const fileExt = file.name.split('.').pop();
            const fileName = `${eventId}_${Date.now()}.${fileExt}`;
            const filePath = `uploads/${fileName}`;

            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('memories_bucket')
                .upload(filePath, file);

            if (uploadError) {
                console.error(uploadError);
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-arrow-up-from-bracket text-xs"></i> Dodaj do księgi`;
                return;
            }

            const { data: { publicUrl } } = supabaseClient.storage
                .from('memories_bucket')
                .getPublicUrl(filePath);

            const { error: dbError } = await supabaseClient.from('memories_photos').insert([
                {
                    event_id: eventId,
                    image_url: publicUrl,
                    author: author
                }
            ]);

            if (dbError) {
                console.error(dbError);
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-arrow-up-from-bracket text-xs"></i> Dodaj do księgi`;
                return;
            }

            // Ustawienie danych w ramce polaroida
            document.getElementById('polaroid-img').src = publicUrl;
            document.getElementById('polaroid-caption').textContent = author;

            // Przełączenie widoków
            document.getElementById('upload-view').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('photo-form').reset();
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('upload-preview-container').classList.add('hidden');
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('submit-btn').innerHTML = `<i class="fa-solid fa-arrow-up-from-bracket text-xs"></i> Dodaj do księgi`;
            document.getElementById('success-view').classList.add('hidden');
            document.getElementById('upload-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
